[package]
name = "flex-db"
version = "2.2.1"
edition = "2024"
description = "Rust SDK for the Flex DB API — async, typed, minimal dependencies"
license = "Apache 2.0"
repository = "https://github.com/arctics-development-studios/flex-db-rust"
homepage = "https://flex.arctics.dev/"
documentation = "https://flex.arctics.dev/docs/sdk-rust/setup"
readme = "ReadMe.md"
keywords = ["flexdb", "database", "sdk", "async"]
categories = ["api-bindings", "database"]
exclude = ["api_definition.md", ".claude/"]

[dependencies]
reqwest   = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
